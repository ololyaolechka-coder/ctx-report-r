name: Обновление дашборда

on:
  schedule:
    - cron: '17 4 * * *'   # каждый день в 07:17 по Москве
  workflow_dispatch:        # кнопка ручного запуска

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка библиотек
        run: pip install requests

      - name: Доступы из секретов
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
        run: |
          test -n "$YANDEX_TOKEN" || { echo "Не задан секрет YANDEX_TOKEN"; exit 1; }
          python -c "import json,os;t=os.environ['YANDEX_TOKEN'].strip();json.dump({'direct':t,'metrika':t},open('config.json','w'))"

      - name: Сбор отчёта
        run: python update.py

      - name: Подготовка страницы
        env:
          REPORT_PATH: ${{ secrets.REPORT_PATH }}
        run: |
          rm -f config.json
          test -n "$REPORT_PATH" || { echo "Не задан секрет REPORT_PATH"; exit 1; }
          mkdir -p "site/$REPORT_PATH"
          cp report.html "site/$REPORT_PATH/index.html"
          printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Not found</title>' > site/index.html
          chmod -R a+rX site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4

      - name: Отметка активности (раз в неделю, чтобы GitHub не отключил расписание)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            date -u +%F > last_run.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add last_run.txt
            git commit -m "Еженедельная отметка запуска" && git push || true
          fi
